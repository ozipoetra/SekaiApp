name: Build

# Sekai's build pipeline, hosted in THIS (public) repo: GitHub
# Actions minutes are free for public repos, while the private
# sekai repo's Actions are billing-limited. The workflow checks
# out the private ozipoetra/sekai source with a read-only token
# (secret SEKAI_REPO_TOKEN) — the source itself stays private;
# only the built binaries (already published as releases here)
# and the run logs are public.
#
# One matrix workflow for every platform. Runs on manual
# dispatch and as a reusable workflow — the Publish release
# workflow calls it (workflow_call) so releases are built by
# exactly the same steps.
#
# Legs (fail-fast off, so one platform's failure never hides the
# others): Android universal, Windows x64 (MSI only), Linux x64
# (deb + rpm). Artifact names are the contract the publish job
# collects: sekai-android-release, sekai-windows, sekai-linux.
#
# The Android leg builds ONE universal APK carrying both ABIs
# (--target aarch64 armv7): a single file installs on 64-bit and
# 32-bit devices alike (Ozi's trade-off call).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Sekai ref to build (branch, tag or SHA)"
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        description: "Sekai ref to build (branch, tag or SHA)"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android
            name: Android universal (arm64 + armv7)
            os: ubuntu-latest
            build_cmd: |
              export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
              bun run tauri -- android build --target aarch64 armv7
            artifact_name: sekai-android-release
            artifact_path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          - id: windows
            name: Windows x64
            os: windows-latest
            # MSI only (Ozi's call 2026-11-17): no NSIS setup .exe
            # is built or shipped for Windows.
            build_cmd: bun run tauri -- build --bundles msi
            artifact_name: sekai-windows
            artifact_path: |
              src-tauri/target/release/bundle/msi/*.msi
          - id: linux
            name: Linux x64 (deb + rpm)
            os: ubuntu-latest
            build_cmd: bun run tauri -- build --bundles deb,rpm
            artifact_name: sekai-linux
            artifact_path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - name: Checkout Sekai source (private repo, read-only token)
        uses: actions/checkout@v7
        with:
          repository: ozipoetra/sekai
          token: ${{ secrets.SEKAI_REPO_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # ── Android legs: Java, Gradle, SDK/NDK, signing ────────────
      - name: Setup Java (Temurin 21)
        if: startsWith(matrix.id, 'android')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle (caching)
        if: startsWith(matrix.id, 'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        if: startsWith(matrix.id, 'android')
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"

      - name: Configure Android signing (from secrets)
        if: startsWith(matrix.id, 'android')
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > keystore.properties

      # ── Linux leg: Tauri's system dependencies ──────────────────
      - name: Install Tauri Linux dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            rpm

      # ── Rust (Android legs need the Android targets) ────────────
      - name: Setup Rust (Android targets)
        if: startsWith(matrix.id, 'android')
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup Rust (stable)
        if: ${{ !startsWith(matrix.id, 'android') }}
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Build
        shell: bash
        env:
          # Baked into the frontend bundle for TMDB enrichment (optional).
          VITE_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
